[project]
name = "perception3d"
version = "0.1.0"
description = "Rule-based 3D object detection from KITTI LiDAR"
readme = "README.md"
authors = [
    { name = "Maximiliano Mamone", email = "maximiliano.n.mamone@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy==2.5.3",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
    "opencv-python-headless==5.0.0.93",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
